services:
  - type: web
    name: blockguard-backend
    runtime: docker
    rootDir: blockguard/backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FUJI_RPC_URL
        value: https://api.avax-test.network/ext/bc/C/rpc
      - key: REGISTRY_CONTRACT_ADDRESS
        value: 0xD9Af5beCC24CCeF628b1CEDF2651d1c2EB020F0A
      - key: CORS_ORIGIN
        value: "*"
